services:
  todolist.api:
    image: todolist.api
    build:
      context: .
      dockerfile: src/TodoList.API/Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=todolist;Uid=root;Pwd=${MYSQL_ROOT_PASSWORD};
    depends_on:
      - db
  db:
    image: mysql:lts
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: todolist
    volumes:
      - todolist_db:/var/lib/mysql

volumes:
  todolist_db:
